services:
  spark-master:
    image: spark:4.0.2-scala2.13-java17-python3-ubuntu
    container_name: p3-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7078:7077"

  spark-worker-1:
    image: spark:4.0.2-scala2.13-java17-python3-ubuntu
    container_name: p3-spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master

  spark-worker-2:
    image: spark:4.0.2-scala2.13-java17-python3-ubuntu
    container_name: p3-spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master

  namenode:
    image: apache/hadoop:3.5.0
    container_name: p3-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    ports:
      - "9871:9870"
      - "9001:9000"
    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
      - ./docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./data:/data:ro

  datanode:
    image: apache/hadoop:3.5.0
    container_name: p3-datanode
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    ports:
      - "9865:9864"
    volumes:
      - datanode_data:/tmp/hadoop-root/dfs/data
      - ./docker/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml

  spark-app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: p3-spark-app
    hostname: spark-app
    command: ["sleep", "infinity"]
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - namenode
      - datanode

volumes:
  namenode_data:
  datanode_data: